<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener | High-Performance Link Service</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 520px;
      border: 1px solid #334155;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      color: #38bdf8;
    }
    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 24px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input[type="url"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="url"]:focus {
      border-color: #38bdf8;
    }
    button.btn-primary {
      padding: 14px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-primary:hover {
      background: #0369a1;
    }
    .result-box {
      margin-top: 24px;
      padding: 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      display: none;
    }
    .result-label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .short-link-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .short-url {
      color: #38bdf8;
      font-weight: 600;
      word-break: break-all;
      text-decoration: none;
    }
    .short-url:hover {
      text-decoration: underline;
    }
    .copy-btn {
      padding: 8px 14px;
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .copy-btn:hover {
      background: #475569;
    }
    .error-box {
      margin-top: 16px;
      padding: 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      border-radius: 8px;
      color: #fca5a5;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>URL Shortener</h1>
    <p class="subtitle">Fast, collision-free short links powered by Redis & SQLite</p>

    <div class="input-group">
      <input type="url" id="longUrl" placeholder="https://example.com/very-long-url" required>
      <button class="btn-primary" id="shortenBtn">Shorten URL</button>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="result-box" id="resultBox">
      <div class="result-label">Shortened URL</div>
      <div class="short-link-container">
        <a href="#" target="_blank" class="short-url" id="shortLink"></a>
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
    </div>
  </div>

  <script>
    const shortenBtn = document.getElementById('shortenBtn');
    const longUrlInput = document.getElementById('longUrl');
    const resultBox = document.getElementById('resultBox');
    const errorBox = document.getElementById('errorBox');
    const shortLink = document.getElementById('shortLink');
    const copyBtn = document.getElementById('copyBtn');

    shortenBtn.addEventListener('click', async () => {
      const originalUrl = longUrlInput.value.trim();
      errorBox.style.display = 'none';
      resultBox.style.display = 'none';

      if (!originalUrl) {
        showError('Please enter a valid URL.');
        return;
      }

      shortenBtn.textContent = 'Shortening...';
      shortenBtn.disabled = true;

      try {
        const response = await fetch('/api/v1/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ originalUrl })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to shorten URL');
        }

        shortLink.href = data.data.shortUrl;
        shortLink.textContent = data.data.shortUrl;
        resultBox.style.display = 'block';
      } catch (err) {
        showError(err.message);
      } finally {
        shortenBtn.textContent = 'Shorten URL';
        shortenBtn.disabled = false;
      }
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(shortLink.href);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => {
        copyBtn.textContent = 'Copy';
      }, 2000);
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }
  </script>
</body>
</html>
